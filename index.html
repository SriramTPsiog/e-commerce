<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ec373b">
  <title>Sign in · BuyIt :)</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-page">
  <a class="skip" href="#login-form">Skip to sign in</a>
  <header class="masthead">
  </header>
  <main class="spread" id="main">
    <figure class="cover">
      <img class="cover-art" src="./assets/login/marvel-delivery.webp" alt="Captain America’s shield, Thor’s hammer, and Iron Man’s gauntlet burst from a delivery box." fetchpriority="high" width="1536" height="1024">
      <figcaption class="cover-title">
        <span>Think it.</span>
        <strong>BuyIt!</strong>
      </figcaption>
    </figure>
    <section class="login-panel" aria-labelledby="welcome">
      <div class="print-corner" aria-hidden="true"></div>
      <div class="login-content">
        <h1 id="welcome">Welcome <em>back!</em></h1>
        <p class="intro">Shop your favorite Marvel merchandise.</p>
        <form id="login-form" method="post">
          <label for="identity">Email address</label>
          <div class="input-wrap">
            <span class="field-icon envelope" aria-hidden="true"></span>
            <input id="identity" name="identity" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter your email" required>
          </div>
          <label for="password">Password</label>
          <div class="input-wrap password-field">
            <span class="field-icon lock" aria-hidden="true"></span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" id="toggle-password" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="submit" type="submit">Sign in</button>
        </form>
      </div>
    </section>
</main>
<header class="masthead">
</header>
  <script type="module" src="./main.js"></script>
</body>
</html>
